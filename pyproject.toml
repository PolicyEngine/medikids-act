[project]
name = "medikids-act"
version = "0.1.0"
description = "Draft first PolicyEngine estimate of the MediKids Act (S. 5037): Medicaid for everyone under 26"
requires-python = "==3.13.*"
dependencies = [
    "policyengine[us]==6.20.3",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medikids_act"]

[tool.pytest.ini_options]
# Single-household and property tests. The national runs are not tests: they
# run through medikids_act.pipeline, one at a time, and never in public CI.
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ISC", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The engine's model_api is designed for a star import.
"medikids_act/reform.py" = ["F403", "F405"]
